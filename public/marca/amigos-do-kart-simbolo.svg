<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Amigos do Kart: mesma geometria de src/components/logo.tsx -->
  <rect width="64" height="64" rx="15" fill="#ffd400" />
  <g transform="skewX(-10) translate(5 0)">
    <defs>
      <clipPath id="pista"><polygon points="12,52 52,52 34,8 30,8" /></clipPath>
      <pattern id="xadrez" width="5" height="5" patternUnits="userSpaceOnUse">
        <rect width="5" height="5" fill="#121216" />
        <rect width="2.5" height="2.5" fill="#ecebe6" />
        <rect x="2.5" y="2.5" width="2.5" height="2.5" fill="#ecebe6" />
      </pattern>
    </defs>
    <polygon points="12,52 52,52 34,8 30,8" fill="#121216" />
    <g clip-path="url(#pista)">
      <rect x="0" y="30" width="64" height="5" fill="url(#xadrez)" />
      <rect x="30.6" y="40" width="2.8" height="8" rx="0.6" fill="#ffd400" />
      <rect x="30.9" y="22" width="2.2" height="5" rx="0.5" fill="#ffd400" />
      <rect x="31.35" y="14.5" width="1.3" height="2.6" rx="0.4" fill="#ffd400" />
    </g>
  </g>
</svg>
